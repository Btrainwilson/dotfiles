# General settings
[general]
import = [] # You can import external themes here
live_config_reload = true # Hot-reloads settings on save

# Window customization
[window]
padding = { x = 12, y = 12 } # Buffer space between text and borders
dynamic_padding = false
decorations = "full" # Options: "full", "none", "transparent", "buttonless"
opacity = 0.95 # Window transparency (0.0 to 1.0)
blur = true # Background blur (macOS/KDE/Gnome)

# Font configuration
[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font" # Replace with your preferred system font
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

# Cursor settings
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

# Terminal Scrollback
[scrolling]
history = 10000
multiplier = 3

# Tokyo Night Color Scheme Example
[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.normal]
black   = "#32344a"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#444b6a"
red     = "#ff007c"
green   = "#b9f27c"
yellow  = "#ff9e64"
blue    = "#7da6ff"
magenta = "#bb9af7"
cyan    = "#0db9d7"
white   = "#acb0d0"

